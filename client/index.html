<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Catálogo FULLTECH - PWA</title>
    
    <!-- PWA Manifest & Theme -->
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1563013544-824ae1b704d3?ixlib=rb-4.0.3&auto=format&fit=crop&w=192&h=192">
    <link rel="manifest" href="/manifest.json">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Catálogo FULLTECH - Descubre los últimos productos tecnológicos con la mejor calidad y precios. Smartphones, laptops, accesorios y más.">
    <meta property="og:title" content="Catálogo FULLTECH - Tecnología de Vanguardia">
    <meta property="og:description" content="Descubre los últimos productos tecnológicos con la mejor calidad y precios">
    <meta property="og:image" content="https://images.unsplash.com/photo-1563013544-824ae1b704d3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&h=630">
    <meta property="og:type" content="website">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- DNS Prefetch para optimización -->
    <link rel="dns-prefetch" href="//images.unsplash.com">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Registro de Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw-minimal.js');
            console.log('SW registered: ', registration);
            
            // Service Worker básico funcionando
          } catch (registrationError) {
            console.log('SW registration failed: ', registrationError);
          }
        });
      }
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
